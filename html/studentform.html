<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Form</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightgray;
        }

        .form-box {
            width: 400px;
            margin: 50px auto;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
            color: blue;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <div class="form-box">

        <h2>Student Registration Form</h2>

        <form>

            <label for="studentName">Student Name:</label>
            <input type="text" id="studentName" placeholder="Enter your name">

            <label for="studentEmail">Email:</label>
            <input type="email" id="studentEmail" placeholder="Enter your email">

            <label for="studentPassword">Password:</label>
            <input type="password" id="studentPassword" placeholder="Enter password">

            <label for="studentMobile">Mobile Number:</label>
            <input type="tel" id="studentMobile" placeholder="Enter mobile number">

            <label for="studentDob">Date of Birth:</label>
            <input type="date" id="studentDob" title="Date of Birth" placeholder="YYYY-MM-DD">

            <label>Gender:</label>
            <input type="radio" id="genderMale" name="gender" title="Male" value="male"> <label for="genderMale">Male</label>
            <input type="radio" id="genderFemale" name="gender" title="Female" value="female"> <label for="genderFemale">Female</label>

            <label for="studentCourse">Course:</label>
            <select id="studentCourse" title="Course">
                <option>Select Course</option>
                <option>BCA</option>
                <option>BBA</option>
                <option>B.Com</option>
                <option>MCA</option>
            </select>

            <label for="studentAddress">Address:</label>
            <textarea id="studentAddress" rows="4" placeholder="Enter your address"></textarea>

            <input type="submit" value="Submit">

        </form>

    </div>

</body>
</html>
